<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B08D47" />
      <stop offset="100%" stop-color="#F5D77F" />
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#3A2A08" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Interlocked Gold Wedding Rings -->
  <!-- Left Ring -->
  <circle cx="25" cy="35" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" filter="url(#ringGlow)" />
  
  <!-- Right Ring -->
  <circle cx="39" cy="35" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" filter="url(#ringGlow)" />
  
  <!-- Interlock Overlap Arc -->
  <path d="M 25 19 A 16 16 0 0 1 40 33" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round" />

  <!-- Sparkling Diamond Highlight at Top -->
  <path d="M 25 11 L 27.5 15.5 L 32 18 L 27.5 20.5 L 25 25 L 22.5 20.5 L 18 18 L 22.5 15.5 Z" fill="#FFFDF0" />
  <circle cx="25" cy="18" r="2" fill="#FFFFFF" />
</svg>
